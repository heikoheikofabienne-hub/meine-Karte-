{% extends "base.html" %}
{% block content %}
<div class="row g-4"><div class="col-lg-4"><div class="card shadow-sm"><div class="card-header bg-white fw-bold">Keyword hinzufügen</div><div class="card-body"><form method="post"><label class="form-label">Suchbegriff</label><input class="form-control mb-3" name="term" required><button class="btn btn-primary">Speichern</button></form></div></div></div>
<div class="col-lg-8"><div class="card shadow-sm"><div class="card-header bg-white fw-bold">Verwaltbare Keyword-Liste</div><div class="table-responsive"><table class="table align-middle mb-0"><thead class="table-light"><tr><th>Keyword</th><th>Aktiv</th><th></th></tr></thead><tbody>{% for keyword in keywords %}<tr><form method="post" action="{{ url_for('keyword_update', keyword_id=keyword.id) }}"><td><input class="form-control" name="term" value="{{ keyword.term }}"></td><td><input class="form-check-input" type="checkbox" name="active" {% if keyword.active %}checked{% endif %}></td><td><button class="btn btn-sm btn-outline-primary">Aktualisieren</button></td></form></tr>{% endfor %}</tbody></table></div></div></div></div>
{% endblock %}
