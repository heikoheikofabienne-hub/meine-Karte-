{% set item = opportunity or {} %}
<div class="col-md-8"><label class="form-label">Titel</label><input class="form-control" name="title" value="{{ item.title or '' }}" required></div>
<div class="col-md-4"><label class="form-label">Quelle</label><input class="form-control" name="source" value="{{ item.source or 'Manuell' }}" required></div>
<div class="col-md-8"><label class="form-label">Link</label><input class="form-control" name="link" value="{{ item.link or '' }}" type="url"></div>
<div class="col-md-4"><label class="form-label">Auftraggeber</label><input class="form-control" name="client" value="{{ item.client or '' }}"></div>
<div class="col-md-3"><label class="form-label">Ort</label><input class="form-control" name="location" value="{{ item.location or '' }}"></div>
<div class="col-md-3"><label class="form-label">Bundesland</label><input class="form-control" name="state" value="{{ item.state or 'Thüringen' }}"></div>
<div class="col-md-3"><label class="form-label">Entfernung zu Greiz (km)</label><input class="form-control" name="distance_km" value="{{ item.distance_km or '' }}" type="number" step="0.1" placeholder="optional"></div>
<div class="col-md-3"><label class="form-label">Deadline</label><input class="form-control" name="deadline" value="{{ item.deadline or '' }}" type="date"></div>
<div class="col-md-4"><label class="form-label">Kategorie</label><select class="form-select" name="category">{% for category in categories %}<option {% if item.category == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label">Projektpotenzial</label><select class="form-select" name="potential">{% for value in ['Niedrig','Mittel','Hoch','Sehr hoch'] %}<option {% if item.potential == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status">{% for status in statuses %}<option {% if item.status == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label">Beschreibung</label><textarea class="form-control" name="description" rows="5">{{ item.description or '' }}</textarea></div>
<div class="col-12"><label class="form-label">Notizen</label><textarea class="form-control" name="notes" rows="3">{{ item.notes or '' }}</textarea></div>
